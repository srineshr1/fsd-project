# Velozity Ops API + Postgres on Render.
# Apply: https://dashboard.render.com/blueprint/new?repo=https://github.com/srineshr1/fsd-project

databases:
  - name: velozity-ops-db
    plan: free
    region: singapore
    postgresMajorVersion: 16
    databaseName: velo
    user: velo

services:
  - type: web
    name: velozity-ops-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npx prisma migrate deploy && node dist/src/index.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: velozity-ops-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: FRONTEND_ORIGIN
        value: https://fsd-project-frontend-umber.vercel.app
      - key: OVERDUE_CRON
        value: "*/1 * * * *"
